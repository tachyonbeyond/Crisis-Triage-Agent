[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-triage"
version = "0.1.0"
description = "Crisis triage agent: Strands Decider 2B for tone, Amazon Bedrock for safety and replies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tachyonbeyond" }]
keywords = ["strands-decider-2b", "policy", "crisis-triage", "bedrock", "agents"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "boto3>=1.43",
    "python-dotenv>=1.0",
    "strands-agents>=1.61",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
crisis-triage = "crisis_triage.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "live: requires a running Decider server on :8000 (deselect with -m 'not live')",
]
addopts = "-m 'not live'"